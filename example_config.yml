config_version: 1

database_host: "127.0.0.1"
database_port: "5432"
database_dbname: "postgres"
database_username: "marlin"
database_password: "linmar"

host: "defaulttailer"

services:
  - service: "probe"
    # Directory in which the probe writes its log file. Set this before starting,
    # marlinstash reads nothing for the service till the directory exists.
    logrootdir: "/path/to/probe/logs"
    # Regex for names of log files in logrootdir (and directories in it)
    fileregex: "nohup\\.out(\\.[0-9]+)?"
